org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Left off deliberately for the first build. The Baseline Profile plugin and
# KSP are both configuration-cache compatible in these versions, but this
# project has never been executed against a real toolchain, so the safer
# default is to let the first build succeed and enable this afterwards.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# R8 in full mode. This is the AGP 8 default; it is set explicitly so that a
# future AGP upgrade cannot silently change the shrinking behaviour that the
# release keep rules were written against.
android.enableR8.fullMode=true

kotlin.code.style=official
